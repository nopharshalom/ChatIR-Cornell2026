# OPTIONAL, PAID (~$0.10/M input, $0.15/M output for Qwen3.5-9B, Nov 2026). Same open model as
# Ollama but full precision on a hosted GPU, so results are NOT bit-identical to the Ollama runs
# (different fingerprint). Use for every method in a comparison, or for none.
#   export OPENROUTER_API_KEY=...
agent:
  llm:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3.5-9b
    api_key_env: OPENROUTER_API_KEY
    disable_thinking: false
    extra_body: {reasoning: {enabled: false}}
    timeout: 60
eval:
  workers: 16
